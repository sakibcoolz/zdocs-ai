<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zdocs-ai</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>zdocs-ai</h1>
    <p>Stage a GitHub repo, then ask questions about it.</p>
  </header>

  <main>
    <section id="stage-panel">
      <h2>Stage a repository</h2>

      <form id="url-form">
        <label for="url-input">GitHub repo URL</label>
        <input id="url-input" type="text" placeholder="https://github.com/owner/repo" required />
        <button type="submit">Download &amp; stage</button>
      </form>

      <form id="upload-form">
        <label for="file-input">Or upload a .zip</label>
        <input id="file-input" type="file" accept=".zip" required />
        <button type="submit">Upload &amp; stage</button>
      </form>

      <p id="stage-status" role="status"></p>

      <h2>Staged repositories</h2>
      <ul id="repo-list"></ul>
    </section>

    <section id="work-panel">
      <div class="tabs" role="tablist">
        <button id="tab-chat" class="tab active" role="tab" aria-selected="true" aria-controls="chat-panel" type="button">Chat</button>
        <button id="tab-analysis" class="tab" role="tab" aria-selected="false" aria-controls="analysis-panel" type="button">Analysis</button>
        <span id="work-repo-name" class="repo-badge"></span>
      </div>

      <div id="chat-panel" role="tabpanel" aria-labelledby="tab-chat">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" type="text" placeholder="Select a repo to start chatting" disabled required />
          <button id="chat-send" type="submit" disabled>Send</button>
        </form>
      </div>

      <div id="analysis-panel" role="tabpanel" aria-labelledby="tab-analysis" hidden>
        <p class="hint">
          Read-only analysis by the Repository Operations Agent. Every finding
          carries its source location, how it was detected and how much to
          trust it.
        </p>

        <div class="toolbar">
          <button id="btn-inventory" type="button" disabled>Inventory</button>
          <button id="btn-oop" type="button" disabled>OOP analysis</button>
          <button id="btn-diagrams" type="button" disabled>Diagrams</button>
          <button id="btn-tools" type="button">Tool status</button>
        </div>

        <label class="inline" for="diagram-kinds">Diagrams to generate</label>
        <div id="diagram-kinds" class="chips">
          <label><input type="checkbox" value="class" checked /> Class</label>
          <label><input type="checkbox" value="inheritance" checked /> Inheritance</label>
          <label><input type="checkbox" value="dependency" checked /> Package deps</label>
          <label><input type="checkbox" value="component" /> Components</label>
        </div>

        <p id="analysis-status" role="status"></p>
        <div id="analysis-output"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script src="/analysis.js"></script>
</body>
</html>
